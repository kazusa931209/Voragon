[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voragon-backend"
version = "0.1.0"
description = "Voragon realtime backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "silero-vad>=5.1.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "uvicorn[standard]>=0.32.0",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "silero: integration tests that load the Silero VAD model",
    "faster_whisper: integration tests that load the faster-whisper ASR model",
]
