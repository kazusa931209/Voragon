apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-backend
  namespace: voragon
  labels:
    app.kubernetes.io/name: realtime-backend
    app.kubernetes.io/part-of: voragon
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: realtime-backend
  template:
    metadata:
      labels:
        app: realtime-backend
        app.kubernetes.io/name: realtime-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: realtime-backend
          image: voragon/realtime-backend:ecr
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: realtime-config
          volumeMounts:
            - name: model-cache
              mountPath: /var/lib/voragon/model-cache
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: voragon-model-cache
