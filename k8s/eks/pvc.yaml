apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voragon-model-cache
  namespace: voragon
  labels:
    app.kubernetes.io/name: realtime-backend
    app.kubernetes.io/part-of: voragon
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 10Gi
