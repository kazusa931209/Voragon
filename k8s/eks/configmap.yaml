apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-config
  namespace: voragon
  labels:
    app.kubernetes.io/name: realtime-backend
    app.kubernetes.io/part-of: voragon
data:
  ASR_BACKEND: "remote"
  ASR_REMOTE_BASE_URL: "http://asr-service:8081"
  ASR_MODEL: "tiny"
  LOG_FORMAT: "json"
  HOST: "0.0.0.0"
  PORT: "8000"
  HF_HOME: "/var/lib/voragon/model-cache/huggingface"
  TORCH_HOME: "/var/lib/voragon/model-cache/torch"
