apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: voragon
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/part-of: voragon
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: ai-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
