apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voragon-asr-model-cache
  namespace: voragon
  labels:
    app.kubernetes.io/name: asr-service
    app.kubernetes.io/part-of: voragon
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 10Gi
