apiVersion: v1
kind: Service
metadata:
  name: asr-service
  namespace: voragon
  labels:
    app.kubernetes.io/name: asr-service
    app.kubernetes.io/part-of: voragon
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: asr-service
  ports:
    - name: http
      port: 8081
      targetPort: http
